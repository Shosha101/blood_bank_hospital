name: blood_bank_hospital
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  # UI and Navigation
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  flutter_screenutil: ^5.9.3
  dropdown_button2: ^2.3.9
  group_dropdown_button: ^1.0.4
  easy_sidemenu: ^0.7.1
  sidebarx: ^0.17.2
  shimmer: ^3.0.0
  # Networking
  dio: ^5.9.0
  retrofit: ^4.7.1
  pretty_dio_logger: ^1.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  cached_network_image: ^3.4.1
  # State Management and Dependency Injection
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  # Storage and Persistence
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  # Serialization and Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # Localization and Utilities
  easy_localization: ^3.0.8
  intl: ^0.20.2
  hexcolor: ^3.0.1
  # Splash Screen
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/safe_blood.png